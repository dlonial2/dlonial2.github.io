<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <link rel="canonical" href="https://happybunny-1.taild032ca.ts.net/">
    <title>Opening Sonny…</title>
    <style>
      :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      body { display: grid; min-height: 100vh; margin: 0; place-items: center; background: #f7f4ec; color: #173d3b; }
      main { max-width: 34rem; padding: 2rem; text-align: center; }
      a { color: #006f66; font-weight: 700; }
      button { padding: .75rem 1rem; border: 1px solid #006f66; border-radius: 999px; background: #006f66; color: white; cursor: pointer; font: inherit; font-weight: 700; }
      button[hidden] { display: none; }
    </style>
  </head>
  <body>
    <main>
      <h1>Opening Sonny</h1>
      <p>The AI student you have to teach.</p>
      <p id="status" role="status">Connecting to the live learning workspace…</p>
      <p><button id="retry" type="button" hidden>Try again</button></p>
      <p><a href="https://happybunny-1.taild032ca.ts.net/">Open Sonny directly</a></p>
    </main>
    <script>
      const target = "https://happybunny-1.taild032ca.ts.net/";
      const status = document.querySelector("#status");
      const retry = document.querySelector("#retry");
      let retryTimer;

      async function openSonny() {
        clearTimeout(retryTimer);
        retry.hidden = true;
        status.textContent = "Connecting to the live learning workspace…";

        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 6000);
        try {
          await fetch(`${target}api/health`, {
            cache: "no-store",
            mode: "no-cors",
            signal: controller.signal
          });
          window.location.replace(target);
        } catch {
          status.textContent = "The live workspace is reconnecting. This page will retry automatically.";
          retry.hidden = false;
          retryTimer = setTimeout(openSonny, 5000);
        } finally {
          clearTimeout(timeout);
        }
      }

      retry.addEventListener("click", openSonny);
      openSonny();
    </script>
  </body>
</html>
